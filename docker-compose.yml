services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-impact}
      POSTGRES_USER: ${POSTGRES_USER:-impact}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    environment:
      NODE_ENV: ${APP_NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-impact}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-impact}
      APP_URL: ${APP_URL:?Set APP_URL in .env}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      IP_HASH_SECRET: ${IP_HASH_SECRET:?Set IP_HASH_SECRET in .env}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
      ADMIN_BOOTSTRAP_SECRET: ${ADMIN_BOOTSTRAP_SECRET:-}
      NOMINATIM_SEARCH_URL: ${NOMINATIM_SEARCH_URL:?Set NOMINATIM_SEARCH_URL in .env}
      NEXT_PUBLIC_MAP_STYLE_URL: ${NEXT_PUBLIC_MAP_STYLE_URL:-https://tiles.openfreemap.org/styles/liberty}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      DEVELOPMENT_TURNSTILE_BYPASS: ${DEVELOPMENT_TURNSTILE_BYPASS:-false}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '${APP_BIND_ADDRESS:-127.0.0.1}:3000:3000'
    restart: unless-stopped

volumes:
  postgres_data:
